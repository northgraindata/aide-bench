name: publish-image
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the base image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker build -t "ghcr.io/northgraindata/aide-systems:${VERSION}" -f docker/base.Dockerfile .
          docker push "ghcr.io/northgraindata/aide-systems:${VERSION}"
