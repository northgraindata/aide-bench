systems:
  - kind: warehouse
    flavor: duckdb
    sql:
      - "create table orders_fact as select i as order_id, date '2026-10-30' as order_date, 100.0 as amount from range(1, 101) t(i) union all select i, date '2026-10-30', 100.0 from range(1, 101) t(i)"
      - "create table daily_orders as select order_date, count(*) as orders, sum(amount) as revenue from orders_fact group by 1"
  - kind: orchestrator
    flavor: prefect
    dags:
      - dag_id: load_orders
        schedule: "0 4 * * *"
        runs:
          - run_id: scheduled-2026-10-30
            state: Completed
            parameters: {date: "2026-10-30"}
            tasks:
              - task_id: load_orders_fact
                tries:
                  - {try_number: 1, state: AwaitingRetry, log: "Task run 'load_orders_fact-0' - inserted 100 rows into orders_fact\nTask run 'load_orders_fact-0' - ERROR writing audit record: connection reset by peer\nTask run 'load_orders_fact-0' - Task run failed with exception, retry 1/1 in 30s"}
                  - {try_number: 2, state: Completed, log: "Task run 'load_orders_fact-0' - Retry 1/1: inserted 100 rows into orders_fact\nTask run 'load_orders_fact-0' - audit record written\nFinished in state Completed()"}
              - {task_id: publish_daily, state: Completed, log: "Finished in state Completed(): refreshed daily_orders"}
  - kind: repo
    flavor: git
    files: repo
    history: history.yaml
