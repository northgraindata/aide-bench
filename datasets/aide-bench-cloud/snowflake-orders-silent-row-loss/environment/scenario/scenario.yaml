systems:
  - kind: warehouse
    flavor: snowflake
    sql:
      - "create table orders_raw as select i as order_id, date '2026-10-30' as order_date, 100.0 as amount, case when i <= 12 then null else 'EUR' end as currency from range(1, 101) t(i)"
      - "create table stg_orders as select * from orders_raw where currency is not null"
      - "create table daily_revenue as select order_date, count(*) as orders, sum(amount) as revenue from stg_orders group by 1"
  - kind: orchestrator
    flavor: prefect
    dags:
      - dag_id: ingest_and_build
        schedule: "0 5 * * *"
        runs:
          - run_id: scheduled-2026-10-30
            state: Completed
            parameters: {date: "2026-10-30"}
            tasks:
              - {task_id: ingest_orders, state: Completed, log: "Finished in state Completed(): loaded 100 rows into ORDERS_RAW"}
              - {task_id: dbt_build, state: Completed, log: "Finished in state Completed(): dbt build: 14 models passed, 0 failed"}
  - kind: repo
    flavor: git
    files: repo
    history: history.yaml
