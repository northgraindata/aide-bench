systems:
  - kind: warehouse
    flavor: duckdb
    sql:
      - |
        create table orders_fact as
        select d * 1000 + i as order_id, date '2026-10-28' + cast(d as integer) as order_date, 100.0 as amount
        from range(0, 3) a(d), range(1, 101) b(i)
      - "insert into orders_fact select 2000 + i, date '2026-10-30', 100.0 from range(1, 101) t(i)"
      - "create table daily_orders as select order_date, count(*) as orders, sum(amount) as revenue from orders_fact group by 1 order by 1"
  - kind: orchestrator
    flavor: airflow
    dags:
      - dag_id: load_orders
        schedule: "0 2 * * *"
        runs:
          - run_id: scheduled__2026-10-30
            state: success
            logical_date: "2026-10-30"
            tasks:
              - task_id: load_orders_fact
                tries:
                  - try_number: 1
                    state: failed
                    log: "INFO connecting to warehouse\nINFO inserted 100 rows into orders_fact for 2026-10-30\nINFO writing audit record\nERROR audit service timed out after 30s\nTask failed with exception AuditTimeout"
                  - try_number: 2
                    state: success
                    log: "INFO connecting to warehouse\nINFO inserted 100 rows into orders_fact for 2026-10-30\nINFO writing audit record\nINFO audit ok"
          - run_id: scheduled__2026-10-29
            state: success
            logical_date: "2026-10-29"
            tasks:
              - {task_id: load_orders_fact, state: success, log: "INFO inserted 100 rows into orders_fact for 2026-10-29\nINFO audit ok"}
  - kind: repo
    flavor: git
    files: repo
    history: history.yaml
  - kind: docs
    flavor: markdown
    dir: docs
