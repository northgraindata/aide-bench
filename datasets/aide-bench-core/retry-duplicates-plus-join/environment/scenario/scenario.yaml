systems:
  - kind: warehouse
    flavor: duckdb
    sql:
      - |
        create table orders_fact as
        select d * 1000 + i as order_id, date '2026-10-28' + cast(d as integer) as order_date,
               (i % 20) + 1 as customer_id, 100.0 as amount
        from range(0, 3) a(d), range(1, 101) b(i)
      - "insert into orders_fact select 2000 + i, date '2026-10-30', (i % 20) + 1, 100.0 from range(1, 101) t(i)"
      - |
        create table dim_customer as
        select i as customer_id, 'customer ' || i as name, true as is_current, date '2026-01-01' as valid_from
        from range(1, 21) t(i)
      - "insert into dim_customer select 7, 'customer 7', false, date '2026-03-01' union all select 7, 'customer 7', false, date '2026-06-01'"
      - |
        create table fct_orders_enriched as
        select o.order_id, o.order_date, o.customer_id, c.name, o.amount
        from orders_fact o join dim_customer c on o.customer_id = c.customer_id
      - "create table revenue_by_day as select order_date, sum(amount) as revenue from fct_orders_enriched group by 1 order by 1"
  - kind: transform
    flavor: dbt
    models:
      - {name: fct_orders_enriched, path: models/marts/fct_orders_enriched.sql, status: success, message: "OK created table", rows_affected: 740, execution_time: 0.6, depends_on: [orders_fact, dim_customer], sql_file: repo/models/marts/fct_orders_enriched.sql}
      - {name: revenue_by_day, path: models/marts/revenue_by_day.sql, status: success, message: "OK created table", rows_affected: 4, execution_time: 0.1, depends_on: [fct_orders_enriched], sql_file: repo/models/marts/revenue_by_day.sql}
    tests:
      - {name: not_null_fct_orders_enriched_order_id, model: fct_orders_enriched, status: pass, failures: 0}
  - kind: orchestrator
    flavor: airflow
    dags:
      - dag_id: load_orders
        schedule: "0 2 * * *"
        runs:
          - run_id: scheduled__2026-10-30
            state: success
            logical_date: "2026-10-30"
            tasks:
              - task_id: load_orders_fact
                tries:
                  - {try_number: 1, state: failed, log: "INFO inserted 100 rows into orders_fact for 2026-10-30\nERROR audit service timed out after 30s\nTask failed with exception AuditTimeout"}
                  - {try_number: 2, state: success, log: "INFO inserted 100 rows into orders_fact for 2026-10-30\nINFO audit ok"}
  - kind: repo
    flavor: git
    files: repo
    history: history.yaml
  - kind: docs
    flavor: markdown
    dir: docs
