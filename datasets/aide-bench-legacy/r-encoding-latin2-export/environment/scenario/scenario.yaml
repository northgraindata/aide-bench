systems:
  - kind: orchestrator
    flavor: cron
    jobs:
      - job_id: loyalty_report
        schedule: "30 5 * * *"
        command: Rscript /opt/r/loyalty.R
        user: reports
        runs:
          - {run_id: "2026-10-30", started: "2026-10-30T05:30:00", exit_code: 0, output_file: logs/run_1030.log}
          - {run_id: "2026-10-28", started: "2026-10-28T05:30:00", exit_code: 0, output_file: logs/run_1028.log}
  - kind: repo
    flavor: git
    files: repo
    history: history.yaml
  - kind: docs
    flavor: markdown
    dir: docs
