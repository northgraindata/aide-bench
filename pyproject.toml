[project]
name = "aide-bench"
version = "0.1.0"
description = "Open benchmark for AI data engineer agents: incident diagnosis and fixes across data stacks"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "mcp>=1.2,<2",
  "pydantic>=2.6,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
aide = "aide_cli.main:main"
aide-call = "aide_systems.call:main"
aide-build = "aide_systems.build:main"
aide-oracle = "aide_systems.oracle:main"
aide-github-mock = "aide_systems.github_mock:main"

[project.entry-points."aide_bench.flavors"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aide_systems", "src/aide_grade", "src/aide_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
